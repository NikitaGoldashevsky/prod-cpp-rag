[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prod-rag"
version = "1.0.0"
description = "Ontology-augmented codebase knowledge: indexes, MCP tools, web UI"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter>=0.22",
  "tree-sitter-cpp>=0.22",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
neo4j = ["neo4j>=5.20"]

[project.scripts]
prod-rag = "prod_rag.cli:main"
prod-rag-mcp = "prod_rag.mcp_server:main"
prod-rag-web = "prod_rag.web:main"

[tool.setuptools.packages.find]
include = ["prod_rag*"]
